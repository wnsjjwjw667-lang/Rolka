<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Персонажи</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--tx:#eceff4;--mut:#8b93a3;--ac:#8b7bff;--me:#5b4bd6}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
a,button{color:var(--ac);background:none;border:0;font:inherit;cursor:pointer;text-decoration:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;color:var(--tx)}
.card:active{border-color:var(--ac)}
.av{width:56px;height:56px;border-radius:50%;background:#262a35;display:grid;place-items:center;font-size:28px;margin-bottom:10px}
.card b{display:block;font-size:17px}.card span{color:var(--mut);font-size:13px}
#chat{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#chat.on{display:flex}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.b{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.u{background:var(--me);align-self:flex-end;border-bottom-right-radius:4px}
.sys{align-self:center;color:var(--mut);font-size:13px;text-align:center}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:120px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font:inherit}
form button{background:var(--ac);color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px}
form button:disabled{opacity:.4}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;padding:20px;z-index:5}
#gate.on{display:grid}
#gate div{background:var(--card);border-radius:18px;padding:22px;max-width:360px;text-align:center}
#gate button{background:var(--ac);color:#fff;border-radius:12px;padding:12px 20px;margin-top:12px}
</style></head><body>
<header><h1>Персонажи</h1><a id="tg" hidden target="_blank">Telegram-бот</a></header>
<div id="grid"></div>
<div id="chat">
  <header><button id="back">←</button><div class="av" style="width:36px;height:36px;font-size:20px;margin:0" id="cav"></div><h1 id="cname"></h1><button id="clr" title="Очистить">🗑</button></header>
  <div id="msgs"></div>
  <form id="f"><textarea id="t" rows="1" placeholder="Напиши сообщение..." maxlength="1000"></textarea><button id="s">➤</button></form>
</div>
<div id="gate"><div><b>Только для взрослых</b><p style="color:var(--mut)">Здесь можно общаться с вымышленными персонажами 18+. Подтверди, что тебе есть 18 лет.</p><button id="ok">Мне есть 18</button></div></div>
<script>
const $=s=>document.querySelector(s);
const st={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let chars=[],cur=null,hist=[],busy=false;
function add(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;$('#msgs').append(d);$('#msgs').scrollTop=1e9;return d}
function render(){$('#msgs').innerHTML='';add('b',cur.greeting);hist.forEach(m=>add(m.role=='user'?'u':'b',m.content))}
function open(c){cur=c;hist=st.get('h'+c.id,[]);$('#cav').textContent=c.emoji;$('#cname').textContent=c.name;render();$('#chat').classList.add('on')}
$('#back').onclick=()=>$('#chat').classList.remove('on');
$('#clr').onclick=()=>{if(confirm('Очистить переписку?')){hist=[];st.set('h'+cur.id,[]);render()}};
$('#ok').onclick=()=>{st.set('adult',1);$('#gate').classList.remove('on')};
$('#t').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
$('#f').onsubmit=async e=>{
  e.preventDefault();const t=$('#t').value.trim();if(!t||busy)return;
  busy=true;$('#s').disabled=true;$('#t').value='';$('#t').style.height='auto';
  hist.push({role:'user',content:t});add('u',t);const w=add('b','...');
  const err=m=>{w.remove();add('sys',m)};
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character:cur.id,messages:hist.slice(-20)})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.reply){w.textContent=j.reply;hist.push({role:'assistant',content:j.reply});st.set('h'+cur.id,hist.slice(-40))}
    else{hist.pop();$('#t').value=t;err(r.status==429?'На сегодня лимит сообщений с сайта закончился. Приходи завтра или пиши в Telegram-боте.':r.status==403?'Этот сервис только для совершеннолетних.':'Сейчас все ИИ заняты. Попробуй ещё раз через минуту.')}
  }catch{hist.pop();$('#t').value=t;err('Нет связи. Попробуй ещё раз.')}
  busy=false;$('#s').disabled=false;
};
(async()=>{
  if(!st.get('adult'))$('#gate').classList.add('on');
  const j=await (await fetch('/api/characters')).json();chars=j.characters;
  if(j.tg){$('#tg').href=j.tg;$('#tg').hidden=false}
  $('#grid').innerHTML='';
  chars.forEach(c=>{const b=document.createElement('button');b.className='card';b.innerHTML='<div class="av"></div><b></b><span></span>';
    b.querySelector('.av').textContent=c.emoji;b.querySelector('b').textContent=c.name;b.querySelector('span').textContent=c.tagline;
    b.onclick=()=>open(c);$('#grid').append(b)});
})();
</script></body></html>
